<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="image.png" alt="image">
        </div>
        <div class="right">
            
            <h2 class="heading">Create your account!</h2>
            <form action="name" class="form">
                <p class="fname">Enter the name</p>
                <input type="text" placeholder="Enter the Name">
                <p class="fname">Enter the Email</p>
                <input type="email" placeholder="Enter the Email">
                <p class="fname">Enter the mobile number</p>
                <input type="tel" placeholder="Enter the mobile number">
                <p class="fname">Enter the password</p>
                <input type="password" name="" id="" placeholder="Enter the password">
                <p class="fname">Enter the password again</p>
                <input type="password" name="" id="" placeholder="Confirm the password">
                <!-- <input type="checkbox" class="checkbox">By clicking the checkbox you agree to our terms and condition</p> -->
            </form>
            <button>Sign up</button>

           <p>If You are already the member! <a href="/Sign in page/index.html">Sign in</a></p> 
        </div>
    </div>
</body>
</html>
